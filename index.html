<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>lo-fi room | музыка для души</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #1e2a2a, #0f191c);
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lofi-card {
            max-width: 950px;
            width: 100%;
            background: rgba(16, 22, 26, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 56px;
            padding: 28px 24px 32px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(230, 215, 170, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .header h1 {
            font-size: 2.1rem;
            background: linear-gradient(135deg, #f2e3c9, #cfb177);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 500;
        }

        .sub {
            color: #b7ab8c;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        /* контейнер для видео */
        .video-container {
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
            background: #00000030;
            margin: 20px 0 18px;
            position: relative;
        }

        /* специальная обёртка, которая перехватывает наведение */
        .video-overlay {
            position: relative;
            width: 100%;
        }

        /* наложение поверх видео — НЕ даёт кликать на кнопки YouTube */
        .video-overlay::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
            cursor: default;
            pointer-events: all;  /* блокируем доступ к видео */
        }

        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
            pointer-events: none; /* дополнительная блокировка */
        }

        .controls-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin: 20px 0 12px;
        }

        .btn {
            background: #2a2f34cc;
            border: none;
            font-size: 1.3rem;
            font-weight: 500;
            padding: 8px 26px;
            border-radius: 60px;
            color: #f0e2c5;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            background: #3f444bd9;
            transform: scale(0.96);
            color: #fff3df;
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #20262cb3;
            padding: 5px 18px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }

        .volume-icon {
            font-size: 1.3rem;
            color: #dccdab;
        }

        input[type="range"] {
            width: 130px;
            height: 4px;
            -webkit-appearance: none;
            background: #4e5b55;
            border-radius: 10px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #f3dfb2;
            border-radius: 50%;
            cursor: pointer;
        }

        .volume-value {
            font-size: 0.8rem;
            color: #cdbc93;
            min-width: 38px;
        }

        .status {
            text-align: center;
            background: #00000033;
            padding: 8px 16px;
            border-radius: 80px;
            font-size: 0.8rem;
            color: #cec09b;
            width: fit-content;
            margin: 12px auto 0;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #7b715a;
            margin-top: 28px;
        }

        @media (max-width: 550px) {
            .lofi-card { padding: 18px; }
            .btn { padding: 6px 18px; font-size: 1rem; }
            .volume-wrap { padding: 4px 14px; }
            input[type="range"] { width: 100px; }
        }
    </style>
</head>
<body>
<div class="lofi-card">
    <div class="header">
        <h1>🎧 lofi комната 🌙</h1>
        <div class="sub">медленный поток · успокаивающие биты</div>
    </div>

    <div class="video-container">
        <div class="video-overlay">
            <div id="youtubePlayer"></div>
        </div>
    </div>

    <div class="controls-panel">
        <button class="btn" id="playBtn">▶ Play</button>
        <button class="btn" id="pauseBtn">⏸ Пауза</button>
        <div class="volume-wrap">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="70">
            <span class="volume-value" id="volumeValue">70%</span>
        </div>
    </div>

    <div class="status" id="nowPlayingStatus">
        🎵 сейчас играет: lo-fi hip hop radio
    </div>
    <footer>⟡ просто слушай и отдыхай ⟡</footer>
</div>

<script>
    let player;
    let isPlayerReady = false;
    const VIDEO_ID = "5yx6BWlEVcY";

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtubePlayer', {
            height: '360',
            width: '100%',
            videoId: VIDEO_ID,
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'rel': 0,
                'modestbranding': 1,
                'disablekb': 1,
                'playsinline': 1,
                'showinfo': 0,
                'iv_load_policy': 3
            },
            events: {
                'onReady': onPlayerReady
            }
        });
    }

    function onPlayerReady(event) {
        isPlayerReady = true;
        event.target.playVideo();
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeVal = volumeSlider ? parseInt(volumeSlider.value) : 70;
        player.setVolume(volumeVal);
        updateVolumeText(volumeVal);
        
        // полностью отключаем все события мыши на iframe
        const iframe = document.querySelector('#youtubePlayer iframe');
        if (iframe) {
            iframe.style.pointerEvents = 'none';
        }
    }

    function playMusic() {
        if (player && isPlayerReady) player.playVideo();
    }

    function pauseMusic() {
        if (player && isPlayerReady) player.pauseVideo();
    }

    function setVolume(volumeLevel) {
        if (player && isPlayerReady) {
            player.setVolume(volumeLevel);
        }
    }

    function updateVolumeText(val) {
        const volumeValueSpan = document.getElementById('volumeValue');
        if (volumeValueSpan) volumeValueSpan.innerText = val + '%';
    }

    document.getElementById('playBtn').addEventListener('click', playMusic);
    document.getElementById('pauseBtn').addEventListener('click', pauseMusic);

    const volumeSlider = document.getElementById('volumeSlider');
    if (volumeSlider) {
        volumeSlider.addEventListener('input', (e) => {
            let vol = parseInt(e.target.value);
            updateVolumeText(vol);
            setVolume(vol);
        });
    }
</script>
</body>
</html>
