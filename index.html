<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>lo-fi room | музыка для души</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            /* ===== ПЕРЕЛИВАЮЩИЙСЯ ФОН ===== */
            background: linear-gradient(135deg, #1a2a2a, #2a1a2a, #1a2a3a, #0f191c);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* анимация перелива фона */
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .lofi-card {
            max-width: 950px;
            width: 100%;
            background: rgba(16, 22, 26, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 56px;
            padding: 28px 24px 32px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(230, 215, 170, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .header h1 {
            font-size: 2.1rem;
            background: linear-gradient(135deg, #f2e3c9, #cfb177);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 500;
        }

        .sub {
            color: #b7ab8c;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .video-container {
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
            background: #00000030;
            margin: 20px 0 18px;
            position: relative;
        }

        .video-overlay {
            position: relative;
            width: 100%;
            user-select: none;
            outline: none;
        }

        .video-overlay::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
            cursor: default;
            pointer-events: all;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
            pointer-events: none;
        }

        .controls-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 20px 0 12px;
        }

        /* ===== КНОПКА PLAY/PAUSE ===== */
        .play-pause-btn {
            background: linear-gradient(145deg, #2a2f34, #1e2227);
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
        }

        .play-pause-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(145deg, #3a4047, #2a2f34);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
        }

        .play-pause-btn:active {
            transform: scale(0.96);
        }

        .play-pause-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(207, 177, 119, 0.3);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .play-pause-btn:active::before {
            opacity: 1;
            animation: pulse 0.4s ease-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .play-icon, .pause-icon {
            display: block;
            transition: all 0.2s ease;
        }

        .play-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 14px 0 14px 22px;
            border-color: transparent transparent transparent #f0e2c5;
            margin-left: 6px;
        }

        .pause-icon {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
        }

        .pause-icon span {
            display: block;
            width: 7px;
            height: 22px;
            background-color: #f0e2c5;
            border-radius: 2px;
        }

        .play-pause-btn.paused .play-icon {
            display: block;
        }
        .play-pause-btn.paused .pause-icon {
            display: none;
        }
        .play-pause-btn:not(.paused) .play-icon {
            display: none;
        }
        .play-pause-btn:not(.paused) .pause-icon {
            display: flex;
        }

        /* ===== МИНИМАЛИСТИЧНЫЙ ПОЛЗУНОК ===== */
        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(32, 38, 44, 0.5);
            padding: 5px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .volume-icon {
            font-size: 1.2rem;
            color: #b7ab8c;
            transition: color 0.2s;
        }

        /* минималистичный range slider */
        input[type="range"] {
            width: 120px;
            height: 2px;
            -webkit-appearance: none;
            background: rgba(180, 170, 140, 0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* бегунок (кружок) */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #dccdab;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 4px rgba(0,0,0,0.2);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
            background: #f0e2c5;
        }

        /* полоска прогресса при наведении (Firefox) */
        input[type="range"]::-moz-range-track {
            height: 2px;
            background: rgba(180, 170, 140, 0.3);
            border-radius: 2px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: #dccdab;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .volume-value {
            font-size: 0.7rem;
            color: #a89a7a;
            min-width: 35px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .status {
            text-align: center;
            background: #00000033;
            padding: 8px 16px;
            border-radius: 80px;
            font-size: 0.8rem;
            color: #cec09b;
            width: fit-content;
            margin: 12px auto 0;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #7b715a;
            margin-top: 28px;
        }

        @media (max-width: 550px) {
            .lofi-card { padding: 18px; }
            .play-pause-btn { width: 60px; height: 60px; }
            .play-icon { border-width: 12px 0 12px 18px; }
            .pause-icon span { width: 6px; height: 18px; }
            .volume-wrap { padding: 4px 12px; gap: 8px; }
            input[type="range"] { width: 90px; }
            .volume-value { font-size: 0.65rem; min-width: 30px; }
        }
    </style>
</head>
<body>
<div class="lofi-card">
    <div class="header">
        <h1>🎧 lofi комната 🌙</h1>
        <div class="sub">медленный поток · успокаивающие биты</div>
    </div>

    <div class="video-container">
        <div class="video-overlay">
            <div id="youtubePlayer"></div>
        </div>
    </div>

    <div class="controls-panel">
        <button class="play-pause-btn paused" id="playPauseBtn">
            <span class="play-icon"></span>
            <span class="pause-icon">
                <span></span>
                <span></span>
            </span>
        </button>

        <div class="volume-wrap">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="70">
            <span class="volume-value" id="volumeValue">70%</span>
        </div>
    </div>

    <div class="status" id="nowPlayingStatus">
        🎵 сейчас играет: lo-fi hip hop radio
    </div>
    <footer>⟡ просто слушай и отдыхай ⟡</footer>
</div>

<script>
    let player;
    let isPlayerReady = false;
    let isPlaying = true;
    const VIDEO_ID = "5yx6BWlEVcY";

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtubePlayer', {
            height: '360',
            width: '100%',
            videoId: VIDEO_ID,
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'rel': 0,
                'modestbranding': 1,
                'disablekb': 1,
                'playsinline': 1,
                'showinfo': 0,
                'iv_load_policy': 3
            },
            events: {
                'onReady': onPlayerReady
            }
        });
    }

    function onPlayerReady(event) {
        isPlayerReady = true;
        event.target.playVideo();
        isPlaying = true;
        
        const btn = document.getElementById('playPauseBtn');
        btn.classList.remove('paused');
        
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeVal = volumeSlider ? parseInt(volumeSlider.value) : 70;
        player.setVolume(volumeVal);
        updateVolumeText(volumeVal);
        
        const iframe = document.querySelector('#youtubePlayer iframe');
        if (iframe) {
            iframe.style.pointerEvents = 'none';
        }
    }

    function togglePlayPause() {
        if (!player || !isPlayerReady) return;
        
        const btn = document.getElementById('playPauseBtn');
        
        if (isPlaying) {
            player.pauseVideo();
            isPlaying = false;
            btn.classList.add('paused');
        } else {
            player.playVideo();
            isPlaying = true;
            btn.classList.remove('paused');
        }
    }

    function setVolume(volumeLevel) {
        if (player && isPlayerReady) {
            player.setVolume(volumeLevel);
        }
    }

    function updateVolumeText(val) {
        const volumeValueSpan = document.getElementById('volumeValue');
        if (volumeValueSpan) volumeValueSpan.innerText = val + '%';
    }

    document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);

    const volumeSlider = document.getElementById('volumeSlider');
    if (volumeSlider) {
        volumeSlider.addEventListener('input', (e) => {
            let vol = parseInt(e.target.value);
            updateVolumeText(vol);
            setVolume(vol);
        });
    }
</script>
</body>
</html>
