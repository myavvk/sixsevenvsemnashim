<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no, maximum-scale=1.0">
    <title>lo-fi room | Станция Лоуфая</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c1f, #1a0f1a, #0a0a1a, #050510);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            touch-action: pan-y;
        }

        html {
            zoom: reset;
            -moz-text-size-adjust: none;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .lofi-card {
            max-width: 950px;
            width: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 56px;
            padding: 28px 24px 32px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(150, 100, 150, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 2.1rem;
            background: linear-gradient(135deg, #f2e3c9, #cfb177);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 500;
            letter-spacing: 1px;
            display: inline-block;
            animation: gentleGlow 2.5s ease-in-out infinite, softFloat 3s ease-in-out infinite;
        }

        @keyframes gentleGlow {
            0% { text-shadow: 0 0 0px rgba(207, 177, 119, 0); }
            50% { text-shadow: 0 0 8px rgba(207, 177, 119, 0.5), 0 0 2px rgba(255, 235, 190, 0.3); }
            100% { text-shadow: 0 0 0px rgba(207, 177, 119, 0); }
        }

        @keyframes softFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
            100% { transform: translateY(0px); }
        }

        .gif-container {
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.7);
            background: #050510;
            margin: 20px 0 18px;
            position: relative;
            border: 1px solid rgba(150, 80, 150, 0.4);
        }

        .gif-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            aspect-ratio: 16 / 9;
            filter: brightness(0.95) contrast(1.05);
        }

        .hidden-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
            top: -9999px;
            left: -9999px;
        }

        .controls-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 45px;
            flex-wrap: wrap;
            margin: 20px 0 12px;
        }

        .play-pause-btn {
            background: linear-gradient(145deg, #1e1a2a, #12101c);
            border: 1px solid rgba(180, 130, 180, 0.4);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
        }

        .play-pause-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(145deg, #2e2540, #1e1a2a);
            border-color: rgba(200, 150, 200, 0.6);
        }

        .play-pause-btn:active {
            transform: scale(0.96);
        }

        .play-pause-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(160, 100, 160, 0.3);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .play-pause-btn:active::before {
            opacity: 1;
            animation: pulse 0.4s ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .play-icon, .pause-icon {
            display: block;
            transition: all 0.2s ease;
        }

        .play-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 14px 0 14px 22px;
            border-color: transparent transparent transparent #d9b4d9;
            margin-left: 6px;
        }

        .pause-icon {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
        }

        .pause-icon span {
            display: block;
            width: 7px;
            height: 22px;
            background-color: #d9b4d9;
            border-radius: 2px;
        }

        .play-pause-btn.paused .play-icon {
            display: block;
        }
        .play-pause-btn.paused .pause-icon {
            display: none;
        }
        .play-pause-btn:not(.paused) .play-icon {
            display: none;
        }
        .play-pause-btn:not(.paused) .pause-icon {
            display: flex;
        }

        .volume-wrap {
            background: rgba(20, 15, 30, 0.7);
            padding: 8px 22px;
            border-radius: 60px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(150, 100, 150, 0.3);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        input[type="range"].volume-slider {
            width: 150px;
            height: 2px;
            -webkit-appearance: none;
            background: rgba(180, 150, 180, 0.4);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"].volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #c9a0c9;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 4px #b77eb7;
        }

        input[type="range"].volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            background: #e0bae0;
        }

        .volume-value {
            font-size: 0.75rem;
            color: #b999c9;
            min-width: 40px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .status {
            text-align: center;
            background: #00000055;
            padding: 8px 16px;
            border-radius: 80px;
            font-size: 0.8rem;
            color: #bbaacc;
            width: fit-content;
            margin: 12px auto 0;
            backdrop-filter: blur(4px);
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #6a5a7a;
            margin-top: 28px;
        }

        @media (max-width: 550px) {
            .lofi-card { padding: 18px; }
            .header h1 { font-size: 1.5rem; }
            .play-pause-btn { width: 60px; height: 60px; }
            .play-icon { border-width: 12px 0 12px 18px; }
            .pause-icon span { width: 6px; height: 18px; }
            .volume-wrap { padding: 5px 16px; }
            input[type="range"].volume-slider { width: 100px; }
            .controls-panel { gap: 30px; }
        }
    </style>
</head>
<body>
<div class="lofi-card">
    <div class="header">
        <h1>&lt;3 Станция Лоуфая &lt;3</h1>
    </div>

    <div class="gif-container">
        <img src="https://media1.tenor.com/m/iYTigQdnvI0AAAAd/dota-shadow-fiend.gif" alt="Shadow Fiend lofi vibe">
    </div>

    <div class="hidden-player" id="youtubePlayer"></div>

    <div class="controls-panel">
        <button class="play-pause-btn paused" id="playPauseBtn">
            <span class="play-icon"></span>
            <span class="pause-icon">
                <span></span>
                <span></span>
            </span>
        </button>

        <div class="volume-wrap">
            <div class="volume-control">
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="80">
                <span class="volume-value" id="volumeValue">80%</span>
            </div>
        </div>
    </div>

    <div class="status" id="nowPlayingStatus">
        🎵 currently playing: lofi hip hop radio
    </div>
    <footer>⟡ слушай и погружайся ⟡</footer>
</div>

<script>
    let player;
    let isPlayerReady = false;
    let isPlaying = true;
    const VIDEO_ID = "5yx6BWlEVcY";

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtubePlayer', {
            width: '1',
            height: '1',
            videoId: VIDEO_ID,
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'rel': 0,
                'modestbranding': 1,
                'disablekb': 1,
                'playsinline': 1,
                'showinfo': 0,
                'iv_load_policy': 3
            },
            events: {
                'onReady': onPlayerReady
            }
        });
    }

    function onPlayerReady(event) {
        isPlayerReady = true;
        event.target.playVideo();
        isPlaying = true;
        
        const btn = document.getElementById('playPauseBtn');
        btn.classList.remove('paused');
        
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeVal = volumeSlider ? parseInt(volumeSlider.value) : 80;
        player.setVolume(volumeVal);
        updateVolumeText(volumeVal);
    }

    function togglePlayPause() {
        if (!player || !isPlayerReady) return;
        
        const btn = document.getElementById('playPauseBtn');
        
        if (isPlaying) {
            player.pauseVideo();
            isPlaying = false;
            btn.classList.add('paused');
        } else {
            player.playVideo();
            isPlaying = true;
            btn.classList.remove('paused');
        }
    }

    function setVolume(volumeLevel) {
        if (player && isPlayerReady) {
            player.setVolume(volumeLevel);
        }
    }

    function updateVolumeText(val) {
        const volumeValueSpan = document.getElementById('volumeValue');
        if (volumeValueSpan) volumeValueSpan.innerText = val + '%';
    }

    document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);

    const volumeSlider = document.getElementById('volumeSlider');
    if (volumeSlider) {
        volumeSlider.addEventListener('input', (e) => {
            let vol = parseInt(e.target.value);
            updateVolumeText(vol);
            setVolume(vol);
        });
    }
</script>
</body>
</html>
