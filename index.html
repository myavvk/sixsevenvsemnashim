<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>lo-fi room | музыка для души</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2a2a, #2a1a2a, #1a2a3a, #0f191c);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .lofi-card {
            max-width: 950px;
            width: 100%;
            background: rgba(16, 22, 26, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 56px;
            padding: 28px 24px 32px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(230, 215, 170, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .header h1 {
            font-size: 2.1rem;
            background: linear-gradient(135deg, #f2e3c9, #cfb177);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 500;
        }

        .sub {
            color: #b7ab8c;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        /* контейнер с гифкой */
        .gif-container {
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
            background: #00000030;
            margin: 20px 0 18px;
            position: relative;
        }

        .gif-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            aspect-ratio: 16 / 9;
        }

        /* скрытый YouTube-плеер */
        .hidden-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
            top: -9999px;
            left: -9999px;
        }

        .controls-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            margin: 20px 0 12px;
        }

        /* ===== КНОПКА PLAY/PAUSE ===== */
        .play-pause-btn {
            background: linear-gradient(145deg, #2a2f34, #1e2227);
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
        }

        .play-pause-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(145deg, #3a4047, #2a2f34);
        }

        .play-pause-btn:active {
            transform: scale(0.96);
        }

        .play-pause-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(207, 177, 119, 0.3);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .play-pause-btn:active::before {
            opacity: 1;
            animation: pulse 0.4s ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .play-icon, .pause-icon {
            display: block;
            transition: all 0.2s ease;
        }

        .play-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 14px 0 14px 22px;
            border-color: transparent transparent transparent #f0e2c5;
            margin-left: 6px;
        }

        .pause-icon {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
        }

        .pause-icon span {
            display: block;
            width: 7px;
            height: 22px;
            background-color: #f0e2c5;
            border-radius: 2px;
        }

        .play-pause-btn.paused .play-icon {
            display: block;
        }
        .play-pause-btn.paused .pause-icon {
            display: none;
        }
        .play-pause-btn:not(.paused) .play-icon {
            display: none;
        }
        .play-pause-btn:not(.paused) .pause-icon {
            display: flex;
        }

        /* ===== ВЕРТИКАЛЬНЫЙ ПОЛЗУНОК ===== */
        .volume-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(32, 38, 44, 0.4);
            padding: 12px 8px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .volume-vertical {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        input[type="range"].volume-slider {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 4px;
            height: 80px;
            background: rgba(180, 170, 140, 0.3);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"].volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #dccdab;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        input[type="range"].volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #f0e2c5;
        }

        input[type="range"].volume-slider::-moz-range-track {
            width: 4px;
            height: 80px;
            background: rgba(180, 170, 140, 0.3);
            border-radius: 4px;
        }

        input[type="range"].volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #dccdab;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .volume-value {
            font-size: 0.7rem;
            color: #a89a7a;
            text-align: center;
            min-width: 35px;
        }

        .status {
            text-align: center;
            background: #00000033;
            padding: 8px 16px;
            border-radius: 80px;
            font-size: 0.8rem;
            color: #cec09b;
            width: fit-content;
            margin: 12px auto 0;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #7b715a;
            margin-top: 28px;
        }

        @media (max-width: 550px) {
            .lofi-card { padding: 18px; }
            .play-pause-btn { width: 60px; height: 60px; }
            .play-icon { border-width: 12px 0 12px 18px; }
            .pause-icon span { width: 6px; height: 18px; }
            .volume-wrap { padding: 8px 6px; }
            input[type="range"].volume-slider { height: 60px; }
            .controls-panel { gap: 35px; }
        }
    </style>
</head>
<body>
<div class="lofi-card">
    <div class="header">
        <h1>🎧 lofi комната 🌙</h1>
        <div class="sub">медленный поток · успокаивающие биты</div>
    </div>

    <!-- ГИФКА (видимая часть) -->
    <div class="gif-container">
        <img src="https://media1.tenor.com/m/iYTigQdnvI0AAAAd/dota-shadow-fiend.gif" id="loFiGif">
    </div>

    <!-- СКРЫТЫЙ YouTube-плеер (только звук) -->
    <div class="hidden-player" id="youtubePlayer"></div>

    <div class="controls-panel">
        <button class="play-pause-btn paused" id="playPauseBtn">
            <span class="play-icon"></span>
            <span class="pause-icon">
                <span></span>
                <span></span>
            </span>
        </button>

        <div class="volume-wrap">
            <div class="volume-vertical">
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70" orient="vertical">
                <span class="volume-value" id="volumeValue">70%</span>
            </div>
        </div>
    </div>

    <div class="status" id="nowPlayingStatus">
        🎵 сейчас играет: lo-fi hip hop radio
    </div>
    <footer>⟡ просто слушай и отдыхай ⟡</footer>
</div>

<script>
    let player;
    let isPlayerReady = false;
    let isPlaying = true;
    const VIDEO_ID = "5yx6BWlEVcY";  // лоуфай радио

    // загружаем YouTube API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtubePlayer', {
            width: '1',
            height: '1',
            videoId: VIDEO_ID,
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'rel': 0,
                'modestbranding': 1,
                'disablekb': 1,
                'playsinline': 1,
                'showinfo': 0,
                'iv_load_policy': 3
            },
            events: {
                'onReady': onPlayerReady
            }
        });
    }

    function onPlayerReady(event) {
        isPlayerReady = true;
        event.target.playVideo();
        isPlaying = true;
        
        const btn = document.getElementById('playPauseBtn');
        btn.classList.remove('paused');
        
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeVal = volumeSlider ? parseInt(volumeSlider.value) : 70;
        player.setVolume(volumeVal);
        updateVolumeText(volumeVal);
    }

    function togglePlayPause() {
        if (!player || !isPlayerReady) return;
        
        const btn = document.getElementById('playPauseBtn');
        
        if (isPlaying) {
            player.pauseVideo();
            isPlaying = false;
            btn.classList.add('paused');
        } else {
            player.playVideo();
            isPlaying = true;
            btn.classList.remove('paused');
        }
    }

    function setVolume(volumeLevel) {
        if (player && isPlayerReady) {
            player.setVolume(volumeLevel);
        }
    }

    function updateVolumeText(val) {
        const volumeValueSpan = document.getElementById('volumeValue');
        if (volumeValueSpan) volumeValueSpan.innerText = val + '%';
    }

    document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);

    const volumeSlider = document.getElementById('volumeSlider');
    if (volumeSlider) {
        volumeSlider.addEventListener('input', (e) => {
            let vol = parseInt(e.target.value);
            updateVolumeText(vol);
            setVolume(vol);
        });
    }
</script>
</body>
</html>
